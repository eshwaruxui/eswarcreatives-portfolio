<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>UBI Branch Navigator</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--blue:#00589C;--red:#D82A27;--orange:#E7BA1D;--green:#068F48;--dark:#0F172A;--text:#1E293B;--muted:#64748B;--light:#F8FAFC;--card:#FFFFFF;--border:#E2E8F0;--radius:16px}
html,body{height:100%;font-family:'Inter',system-ui,sans-serif;background:var(--light);color:var(--text);overflow:hidden}

/* App Shell */
.app{display:flex;flex-direction:column;height:100%;position:relative}

/* Header */
.header{background:linear-gradient(135deg,#00579C 0%,#003D6E 100%);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.15)}
.header-logo{width:36px;height:36px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.header-logo svg{width:24px;height:24px}
.header-text h1{font-size:14px;font-weight:700;letter-spacing:.3px}
.header-text p{font-size:10px;opacity:.7;margin-top:1px}
.header-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.header-badge{background:rgba(255,255,255,.15);padding:4px 10px;border-radius:20px;font-size:10px;font-weight:600}

/* Search Bar */
.search-area{padding:12px 16px;background:#fff;border-bottom:1px solid var(--border);z-index:90}
.search-box{width:100%;padding:12px 16px 12px 44px;background:var(--light);border:2px solid var(--border);border-radius:14px;font-size:15px;font-family:inherit;color:var(--text);outline:none;transition:border-color .2s}
.search-box:focus{border-color:var(--blue)}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.4}
.search-wrap{position:relative}

/* Filter Chips */
.filters{display:flex;gap:6px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;-webkit-overflow-scrolling:touch;z-index:80}
.filters::-webkit-scrollbar{display:none}
.chip{padding:7px 14px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid var(--border);background:#fff;color:var(--muted);white-space:nowrap;cursor:pointer;transition:all .2s;flex-shrink:0}
.chip.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.chip[data-r="r:Chennai North"].active{background:#D82A27}
.chip[data-r="r:Chennai South"].active{background:#059669}
.chip[data-r="r:Kancheepuram"].active{background:#E7BA1D}
.chip[data-r="r:Salem"].active{background:#7C3AED}

/* Map */
.map-container{flex:1;position:relative;z-index:1}
#map{width:100%;height:100%}
.leaflet-pane,.leaflet-top,.leaflet-bottom{z-index:400 !important}

/* Bottom Sheet */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99998;opacity:0;pointer-events:none;transition:opacity .3s}
.sheet-overlay.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:24px 24px 0 0;z-index:99999;transform:translateY(100%);transition:transform .35s cubic-bezier(.22,.68,0,1.04);max-height:80vh;display:flex;flex-direction:column;box-shadow:0 -8px 40px rgba(0,0,0,.2);will-change:transform}
.sheet.show{transform:translateY(0) !important;visibility:visible !important}
.sheet-handle{width:40px;height:4px;background:#CBD5E1;border-radius:2px;margin:10px auto 0}
.sheet-header{padding:12px 20px 10px;border-bottom:1px solid var(--border)}
.sheet-sol{font-size:11px;font-weight:700;color:var(--blue);font-family:'SF Mono',monospace;letter-spacing:.5px}
.sheet-name{font-size:20px;font-weight:800;margin:4px 0 2px;color:var(--dark)}
.sheet-district{font-size:12px;color:var(--muted)}
.sheet-body{padding:16px 20px;overflow-y:auto;flex:1}
.sheet-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F1F5F9}
.sheet-row:last-child{border:none}
.sheet-row-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.sheet-row-text{flex:1}
.sheet-row-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.sheet-row-value{font-size:13px;font-weight:500;margin-top:1px}
.sheet-actions{display:flex;gap:8px;padding:12px 20px 24px;border-top:1px solid var(--border)}
.sheet-btn{flex:1;padding:14px;border-radius:14px;border:none;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .1s}
.sheet-btn:active{transform:scale(.97)}
.btn-navigate{background:var(--blue);color:#fff}
.btn-call{background:#ECFDF5;color:#059669}
.btn-copy{background:#F1F5F9;color:var(--text)}

/* Branch List (when sheet shows results) */
.results{position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;z-index:99997;transform:translateY(100%);transition:transform .3s cubic-bezier(.22,.68,0,1.04);display:flex;flex-direction:column}
.results.show{transform:translateY(0)}
.results-header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border);background:#fff}
.results-back{width:36px;height:36px;border-radius:12px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;background:#fff}
.results-title{font-size:16px;font-weight:700}
.results-count{font-size:12px;color:var(--muted);margin-left:auto}
.results-list{flex:1;overflow-y:auto;padding:8px 12px}
.result-card{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:6px;background:var(--light);border-radius:14px;cursor:pointer;transition:background .15s;border:1.5px solid transparent}
.result-card:active{background:#EFF6FF;border-color:var(--blue)}
.result-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.result-info{flex:1;min-width:0}
.result-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result-meta{font-size:10px;color:var(--muted);margin-top:2px}
.result-arrow{font-size:14px;color:#CBD5E1;flex-shrink:0}
.result-dist{font-size:11px;font-weight:600;color:var(--blue);flex-shrink:0;text-align:right}

/* Nearby Floating Button */
.fab{position:fixed;bottom:24px;right:16px;z-index:100;width:56px;height:56px;border-radius:50%;background:var(--blue);color:#fff;border:none;font-size:22px;box-shadow:0 4px 20px rgba(37,99,235,.4);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.fab:active{transform:scale(.9)}

/* Pop badge */
.pop-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.pop-label{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.3px}
.pop-METRO{background:#D82A27;color:#fff}
.pop-URBAN{background:#00589C;color:#fff}
.pop-SEMI{background:#E7BA1D;color:#000}
.pop-RURAL{background:#068F48;color:#fff}

/* Loading splash */
.splash{position:fixed;inset:0;background:linear-gradient(135deg,#00579C,#003D6E);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;transition:opacity .5s}
.splash.hide{opacity:0;pointer-events:none}
.splash-logo{width:64px;height:64px;background:#fff;border-radius:18px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;box-shadow:0 4px 20px rgba(0,0,0,.2)}
.splash h2{font-size:18px;font-weight:800;letter-spacing:.5px}
.splash p{font-size:12px;opacity:.6;margin-top:4px}
.splash-bar{width:120px;height:3px;background:rgba(255,255,255,.2);border-radius:2px;margin-top:20px;overflow:hidden}
.splash-bar-fill{width:0%;height:100%;background:#fff;border-radius:2px;transition:width 1s}

.leaflet-popup-content-wrapper{border-radius:14px!important;border:1px solid #E2E8F0!important;box-shadow:0 4px 20px rgba(0,0,0,.1)!important}
.leaflet-popup-tip{background:#fff!important}
</style>
</head>

};

const PC={'METRO':'#D82A27','URBAN':'#00589C','SEMI URBAN':'#E7BA1D','RURAL':'#068F48'};
const popLabel={'METRO':'Metro','URBAN':'Urban','SEMI URBAN':'Semi Urban','RURAL':'Rural'};
let userLat=null,userLon=null,activeFilter='all',searchQuery='';

// Splash
setTimeout(()=>{document.getElementById('splashBar').style.width='100%'},100);
setTimeout(()=>{document.getElementById('splash').classList.add('hide')},1500);

// Map
const map=L.map('map',{zoomControl:false,attributionControl:false}).setView([12.5,79.5],8);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19}).addTo(map);

// District boundaries
fetch('https://cdn.jsdelivr.net/gh/udit-001/india-maps-data@main/geojson/states/tamil-nadu.geojson')
.then(r=>r.json()).then(geo=>{
  L.geoJSON(geo,{
    style:f=>{
      const d=(f.properties.district||f.properties.NAME_2||f.properties.dtname||f.properties.name||'').toUpperCase();
      const pc={'CHENNAI':'#DBEAFE','THIRUVALLUR':'#D1FAE5','CHENGALPATTU':'#FEF3C7','KANCHEEPURAM':'#FCE7F3','VELLORE':'#FEE2E2','RANIPET':'#FEE2E2','TIRUVANNAMALAI':'#CFFAFE','TIRUPATHUR':'#FEE2E2','VILLUPURAM':'#CCFBF1','SALEM':'#EDE9FE','NAMAKKAL':'#EDE9FE','KRISHNAGIRI':'#FFEDD5','DHARMAPURI':'#FFEDD5','PUDUCHERRY':'#F3E8FF'};
      return {color:'#CBD5E1',weight:1,opacity:.5,fillColor:pc[d]||'#F8FAFC',fillOpacity:.35}
    }
  }).addTo(map);
}).catch(()=>{});

// Markers
const markers={};
const allMarkers=L.layerGroup().addTo(map);

branches.forEach(b=>{
  const pinIcon = ICONS[b.pop] || ICONS['RURAL'];
  const icon=L.divIcon({
    html:`<img src="${pinIcon}" width="28" height="36" style="display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.25))" />`,
    className:'',iconSize:[28,36],iconAnchor:[14,36],popupAnchor:[0,-36]
  });
  const m=L.marker([b.lat,b.lon],{icon});
  m.on('click',(e)=>{L.DomEvent.stopPropagation(e);openSheet(b);});
  markers[b.sol]=m;
  allMarkers.addLayer(m);
});

map.fitBounds(branches.map(b=>[b.lat,b.lon]),{padding:[30,30]});

// Geolocation
let userMarker=null;
function getLocation(){
  if(!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(pos=>{
    userLat=pos.coords.latitude;
    userLon=pos.coords.longitude;
    document.getElementById('nearbyBadge').style.display='block';
    if(userMarker)map.removeLayer(userMarker);
    userMarker=L.circleMarker([userLat,userLon],{radius:8,fillColor:'#00589C',fillOpacity:1,color:'#fff',weight:3}).addTo(map);
    userMarker.bindPopup('<b>You are here</b>');
  },()=>{},{enableHighAccuracy:true,timeout:10000});
}
getLocation();

function haversine(lat1,lon1,lat2,lon2){
  const R=6371;const dLat=(lat2-lat1)*Math.PI/180;const dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function getFiltered(){
  let list=branches;
  if(activeFilter==='nearby'&&userLat){
    list=branches.map(b=>({...b,dist:haversine(userLat,userLon,b.lat,b.lon)})).sort((a,b)=>a.dist-b.dist).slice(0,20);
  }else if(activeFilter.startsWith('r:')){
    const r=activeFilter.slice(2);
    list=branches.filter(b=>b.region===r);
  }
  if(searchQuery){
    const q=searchQuery.toLowerCase();
    list=list.filter(b=>b.sol.includes(q)||b.name.toLowerCase().includes(q)||b.district.toLowerCase().includes(q)||b.pin.includes(q)||b.ifsc.toLowerCase().includes(q)||b.addr.toLowerCase().includes(q));
  }
  return list;
}

function updateMap(){
  const fl=getFiltered();
  allMarkers.clearLayers();
  fl.forEach(b=>{if(markers[b.sol])allMarkers.addLayer(markers[b.sol])});
  if(fl.length)map.fitBounds(fl.map(b=>[b.lat,b.lon]),{padding:[40,40]});
}

// Sheet
function openSheet(b){
  const pc=PC[b.pop]||'#068F48';
  const pl=popLabel[b.pop]||b.pop;
  const dist=userLat?haversine(userLat,userLon,b.lat,b.lon):null;
  const popCls=b.pop==='METRO'?'METRO':b.pop==='URBAN'?'URBAN':b.pop==='SEMI URBAN'?'SEMI':'RURAL';

  document.getElementById('sheetHeader').innerHTML=`
    <div class="sheet-sol">SOL ${b.sol} · ${b.ifsc}</div>
    <div class="sheet-name">${b.name}</div>
    <div class="sheet-district">${b.district} · ${b.region}${dist?` · <b>${dist.toFixed(1)} km away</b>`:''}</div>
  `;
  document.getElementById('sheetBody').innerHTML=`
    <div class="sheet-row">
      <div class="sheet-row-icon" style="background:${pc}22;color:${pc}">📍</div>
      <div class="sheet-row-text">
        <div class="sheet-row-label">Address</div>
        <div class="sheet-row-value">${b.addr}</div>
      </div>
    </div>
    <div class="sheet-row">
      <div class="sheet-row-icon" style="background:#F0FDF4">📮</div>
      <div class="sheet-row-text">
        <div class="sheet-row-label">Pincode</div>
        <div class="sheet-row-value">${b.pin}</div>
      </div>
    </div>
    <div class="sheet-row">
      <div class="sheet-row-icon" style="background:${pc}22">🏷️</div>
      <div class="sheet-row-text">
        <div class="sheet-row-label">Branch Type</div>
        <div class="sheet-row-value"><span class="pop-label pop-${popCls}">${pl}</span></div>
      </div>
    </div>
    <div class="sheet-row">
      <div class="sheet-row-icon" style="background:#EFF6FF">🏦</div>
      <div class="sheet-row-text">
        <div class="sheet-row-label">IFSC Code</div>
        <div class="sheet-row-value" style="font-family:monospace;font-weight:700">${b.ifsc}</div>
      </div>
    </div>
    <div class="sheet-row">
      <div class="sheet-row-icon" style="background:#F8FAFC">🌐</div>
      <div class="sheet-row-text">
        <div class="sheet-row-label">Coordinates</div>
        <div class="sheet-row-value" style="font-family:monospace;font-size:11px">${b.lat.toFixed(6)}, ${b.lon.toFixed(6)}</div>
      </div>
    </div>
  `;
  document.getElementById('sheetActions').innerHTML=`
    <button class="sheet-btn btn-navigate" onclick="window.open('https://www.google.com/maps/dir/?api=1&destination=${b.lat},${b.lon}','_blank')">🧭 Navigate</button>
    <button class="sheet-btn btn-call" onclick="window.open('https://www.google.com/maps/search/Union+Bank+of+India+${encodeURIComponent(b.name)}/@${b.lat},${b.lon},17z','_blank')">🔍 Find</button>
    <button class="sheet-btn btn-copy" onclick="navigator.clipboard.writeText('${b.sol} - ${b.name} - ${b.ifsc}');this.textContent='✓ Copied'">📋 Copy</button>
  `;

  const sheetEl = document.getElementById('sheet');
  const overlayEl = document.getElementById('sheetOverlay');
  overlayEl.classList.add('show');
  // Force reflow before adding show class so transition fires
  sheetEl.getBoundingClientRect();
  sheetEl.classList.add('show');
  map.setView([b.lat,b.lon],15,{animate:true});
}

function closeSheet(){
  document.getElementById('sheetOverlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
}
document.getElementById('sheetOverlay').addEventListener('click',closeSheet);

// Results list
function showResults(list,title){
  const el=document.getElementById('resultsList');
  document.getElementById('resultsTitle').textContent=title;
  document.getElementById('resultsCount').textContent=list.length+' branches';
  el.innerHTML=list.map(b=>{
    const pinI = ICONS[b.pop]||ICONS['RURAL'];
    const d=b.dist?`<div class="result-dist">${b.dist.toFixed(1)} km</div>`:'';
    return `<div class="result-card" data-sol="${b.sol}">
      <img src="${pinI}" width="20" height="26" style="flex-shrink:0;filter:drop-shadow(0 1px 2px rgba(0,0,0,.2))" />
      <div class="result-info">
        <div class="result-name">${b.name}</div>
        <div class="result-meta">SOL ${b.sol} · ${b.district} · ${b.pin}</div>
      </div>
      ${d}
      <div class="result-arrow">›</div>
    </div>`;
  }).join('');
  el.querySelectorAll('.result-card').forEach(card=>{
    card.addEventListener('click',()=>{
      const b=branches.find(x=>x.sol===card.dataset.sol);
      if(b){closeResults();openSheet(b)}
    });
  });
  document.getElementById('results').classList.add('show');
}
function closeResults(){document.getElementById('results').classList.remove('show')}
document.getElementById('resultsBack').addEventListener('click',closeResults);

// Search
let searchTimer;
document.getElementById('searchInput').addEventListener('input',e=>{
  searchQuery=e.target.value;
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{
    if(searchQuery.length>=2){
      const fl=getFiltered();
      showResults(fl,'Search: "'+searchQuery+'"');
      updateMap();
    }else if(!searchQuery){
      closeResults();
      updateMap();
    }
  },300);
});

// Filters
document.querySelectorAll('.chip').forEach(chip=>{
  chip.addEventListener('click',()=>{
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
    chip.classList.add('active');
    activeFilter=chip.dataset.r;
    searchQuery='';
    document.getElementById('searchInput').value='';
    
    if(activeFilter==='nearby'){
      if(!userLat){getLocation();return}
      const fl=getFiltered();
      showResults(fl,'Nearest Branches');
    }else{
      closeResults();
    }
    updateMap();
  });
});

// FAB
document.getElementById('fabNearby').addEventListener('click',()=>{
  if(!userLat){
    getLocation();
    setTimeout(()=>{
      if(userLat){
        const list=branches.map(b=>({...b,dist:haversine(userLat,userLon,b.lat,b.lon)})).sort((a,b)=>a.dist-b.dist).slice(0,10);
        showResults(list,'Nearest Branches');
      }
    },2000);
    return;
  }
  const list=branches.map(b=>({...b,dist:haversine(userLat,userLon,b.lat,b.lon)})).sort((a,b)=>a.dist-b.dist).slice(0,10);
  showResults(list,'Nearest Branches');
  map.setView([userLat,userLon],13);
});

// Swipe down to close sheet
let touchStartY=0;
document.getElementById('sheet').addEventListener('touchstart',e=>{touchStartY=e.touches[0].clientY});
document.getElementById('sheet').addEventListener('touchmove',e=>{
  if(e.touches[0].clientY-touchStartY>60)closeSheet();
});
</script>
</body>
</html>
