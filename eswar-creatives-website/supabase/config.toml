# Edge functions called by machines, not by a logged-in user.
#
# These MUST stay verify_jwt = false: the caller (Resend, pg_cron/pg_net, the
# public marketing site) never presents a Supabase JWT, so leaving the gateway
# check on rejects every request with a 401 *before* the function body runs.
# Each one authenticates by its own means instead — see the comments below.
#
# Functions not listed here default to verify_jwt = true, which is correct for
# every admin/client endpoint (they are called from the portal with a user JWT).
#
# This file exists because resend-outreach-webhook was deployed with
# verify_jwt = true and silently rejected 100% of Resend's webhook calls at the
# gateway. Recording the flag here keeps a future `supabase functions deploy`
# from reintroducing that class of bug.

[functions.resend-outreach-webhook]
# Authenticates via svix HMAC signature against RESEND_WEBHOOK_SECRET.
verify_jwt = false

[functions.send-confirmed-outreach-touches]
# Invoked by pg_cron/pg_net; authenticates via the shared x-cron-secret header.
verify_jwt = false

[functions.receive-enquiry]
# Public endpoint for the marketing site's enquiry form; validates server-side.
verify_jwt = false

[functions.notify-submission]
verify_jwt = false

[functions.get-output-file-url]
verify_jwt = false

[functions.get-brand-visual-file-url]
# Public /brand/:token route; the item's own public_token is the credential.
verify_jwt = false

[functions.get-brand-visual-attachment-url]
# Same as get-brand-visual-file-url, one level down: the attachment's own
# public_token is the credential (migration 0097).
verify_jwt = false

[functions.send-otp]
# Public /outreach/signup endpoint; the caller has no session yet at this
# point in the flow. Authenticates the phone number via Msg91, not a JWT.
verify_jwt = false

[functions.verify-otp]
# Same reasoning as send-otp: called before any Supabase session exists.
# Authenticates via the Msg91-verified OTP, then mints the session itself.
verify_jwt = false
